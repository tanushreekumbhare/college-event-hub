# Google App Engine Standard Environment Configuration
runtime: nodejs20

instance_class: F1

automatic_scaling:
  min_instances: 0
  max_instances: 2

# Handlers ensure fast routing and static asset serving
handlers:
  - url: /css
    static_dir: public/css
    secure: always

  - url: /js
    static_dir: public/js
    secure: always

  - url: /.*
    script: auto
    secure: always

