<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - College Event Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <div class="nav-brand-badge">🎓</div>
        <span>College Event Hub</span>
      </a>

      <ul class="nav-links" id="nav-links-container">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="events.html" class="nav-link">Events</a></li>
      </ul>

      <div class="nav-auth" id="nav-auth-container">
        <a href="login.html" class="btn btn-outline btn-sm">Login</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <div class="auth-wrapper">
        <div class="card">
          <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">📝</div>
            <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main);">Create Student Account</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem;">
              Register to discover campus events and reserve your seats
            </p>
          </div>

          <!-- Alert notification container -->
          <div id="auth-alert"></div>

          <form id="register-form" onsubmit="handleRegisterSubmit(event)">
            <div class="form-group">
              <label for="name">Full Name</label>
              <input
                type="text"
                id="name"
                class="form-control"
                placeholder="e.g. Alex Johnson"
                required
                autocomplete="name"
              >
            </div>

            <div class="form-group">
              <label for="email">College Email Address</label>
              <input
                type="email"
                id="email"
                class="form-control"
                placeholder="e.g. alex@college.edu"
                required
                autocomplete="email"
              >
              <div class="form-help">Use your official college or student email address.</div>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Create a strong password (min 6 characters)"
                required
                minlength="6"
                autocomplete="new-password"
              >
            </div>

            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <input
                type="password"
                id="confirmPassword"
                class="form-control"
                placeholder="Confirm your password"
                required
                minlength="6"
                autocomplete="new-password"
              >
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
              Create Account
            </button>
          </form>

          <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account?
            <a href="login.html" style="font-weight: 600; color: var(--primary);">Sign in here</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; 2026 College Event Hub. Built for Google App Engine Deployment.
      </div>
    </div>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
